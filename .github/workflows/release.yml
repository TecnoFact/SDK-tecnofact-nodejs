name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver without v prefix. Empty uses package.json version.'
        required: false
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:coverage

      - name: Build package
        run: npm run build

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          INPUT_VERSION='${{ github.event.inputs.version }}'
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: ${VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail
          TAG='${{ steps.version.outputs.tag }}'
          PREV="$(git tag --list 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -n 1 || true)"
          {
            echo "CHANGELOG<<EOF"
            if [ -n "${PREV}" ]; then
              git log "${PREV}..HEAD" --pretty=format:"- %s (%h)"
            else
              git log --pretty=format:"- %s (%h)"
            fi
            echo
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release and tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Changes in this Release
            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Installation
            ```bash
            npm install @tecnofact/sdk-nodejs@${{ steps.version.outputs.version }}
            ```
          draft: false
          prerelease: false
          make_latest: true

      - name: Publish to npm
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').name")"
          VER='${{ steps.version.outputs.version }}'
          if npm view "${PKG}@${VER}" version >/dev/null 2>&1; then
            echo "npm already has ${PKG}@${VER}; skipping publish"
            exit 0
          fi
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
