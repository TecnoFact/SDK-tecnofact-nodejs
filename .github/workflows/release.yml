name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver without v prefix. Empty uses package.json version.'
        required: false
        type: string
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    name: Detect release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Detect version and trigger
        id: detect
        run: |
          set -euo pipefail
          INPUT_VERSION='${{ github.event.inputs.version }}'
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            SHOULD=true
          elif [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION#v}"
            SHOULD=true
          else
            VERSION="$(node -p "require('./package.json').version")"
            LATEST_TAG="$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)"
            LATEST_VERSION="${LATEST_TAG#v}"
            PKG="$(node -p "require('./package.json').name")"
            if [ "${VERSION}" = "${LATEST_VERSION}" ]; then
              if npm view "${PKG}@${VERSION}" version >/dev/null 2>&1; then
                echo "Version ${VERSION} already released and published; skipping."
                SHOULD=false
              else
                echo "Tag ${LATEST_TAG} exists but ${PKG}@${VERSION} is not on npm; releasing to publish."
                SHOULD=true
              fi
            else
              echo "Version ${VERSION} is newer than latest tag ${LATEST_TAG:-none}; releasing."
              SHOULD=true
            fi
          fi
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: ${VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "should_release=${SHOULD}" >> "${GITHUB_OUTPUT}"

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.should_release == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:coverage

      - name: Build package
        run: npm run build

      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail
          TAG='${{ needs.detect.outputs.tag }}'
          PREV="$(git tag --list 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -n 1 || true)"
          {
            echo "CHANGELOG<<EOF"
            if [ -n "${PREV}" ]; then
              git log "${PREV}..HEAD" --pretty=format:"- %s (%h)"
            else
              git log --pretty=format:"- %s (%h)"
            fi
            echo
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release and tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ needs.detect.outputs.version }}
          body: |
            ## Changes in this Release
            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Installation
            ```bash
            npm install @tecnofact/sdk-nodejs@${{ needs.detect.outputs.version }}
            ```
          draft: false
          prerelease: false
          make_latest: true

      - name: Publish to npm
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').name")"
          VER='${{ needs.detect.outputs.version }}'
          if npm view "${PKG}@${VER}" version >/dev/null 2>&1; then
            echo "npm already has ${PKG}@${VER}; skipping publish"
            exit 0
          fi
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
